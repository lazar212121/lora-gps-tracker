<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LoRa GPS Tracker</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .leaflet-bottom.leaflet-right { display: none; } /* Sakriva default Leaflet logo ako smeta */
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Gornja traka (Minimalistička) -->
    <div class="absolute top-4 left-4 z-[1000] flex items-center space-x-2">
        <!-- Dugme za otvaranje menija -->
        <button onclick="toggleMenu()" class="bg-white p-3 rounded-full shadow-lg border border-gray-200 text-gray-700 hover:bg-gray-50 focus:outline-none transition active:scale-95">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <span class="bg-white/90 backdrop-blur-md px-3 py-1.5 rounded-full shadow-md text-xs font-bold text-gray-700 border border-gray-200" id="connection-status">
            🔴 Nema konekcije
        </span>
    </div>

    <!-- Brzo dugme za simulaciju u gornjem desnom uglu -->
    <div class="absolute top-4 right-4 z-[1000]">
        <button onclick="simulateData()" class="bg-indigo-600 text-white text-xs px-3 py-2 rounded-full shadow-lg font-medium hover:bg-indigo-700 transition active:scale-95">
            ⚡ Simuliraj
        </button>
    </div>

    <!-- Bočni Padajući Meni (Sidebar Drawer) -->
    <div id="side-menu" class="fixed inset-y-0 left-0 w-80 bg-white shadow-2xl z-[2000] transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <!-- Zaglavlje menija -->
        <div class="p-4 bg-gray-900 text-white flex justify-between items-center">
            <h2 class="font-bold text-lg">🛰️ LoRa Tracker Meni</h2>
            <button onclick="toggleMenu()" class="text-gray-400 hover:text-white p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Sadržaj menija (skrolabilan) -->
        <div class="p-4 flex-1 overflow-y-auto space-y-6 text-sm">
            
            <!-- Sekcija: Bluetooth Konekcija -->
            <div class="space-y-2">
                <h3 class="font-semibold text-gray-700 uppercase text-xs tracking-wider">Bluetooth Prijemnik</h3>
                <button onclick="connectBLE()" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg shadow font-medium hover:bg-blue-700 transition">
                    Poveži se sa uređajem
                </button>
            </div>

            <!-- Sekcija: Izbor Mape -->
            <div class="space-y-2">
                <h3 class="font-semibold text-gray-700 uppercase text-xs tracking-wider">Stil Mape</h3>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setLayer('standard')" class="p-2 border rounded-lg text-center hover:bg-gray-50 font-medium text-gray-700 bg-gray-100" id="btn-standard">Standardna</button>
                    <button onclick="setLayer('satellite')" class="p-2 border rounded-lg text-center hover:bg-gray-50 font-medium text-gray-700" id="btn-satellite">Satelitska</button>
                    <button onclick="setLayer('topo')" class="p-2 border rounded-lg text-center hover:bg-gray-50 font-medium text-gray-700" id="btn-topo">Topografska</button>
                    <button onclick="setLayer('dark')" class="p-2 border rounded-lg text-center hover:bg-gray-50 font-medium text-gray-700" id="btn-dark">Tamna</button>
                </div>
            </div>

            <!-- Sekcija: Lista Trakera -->
            <div class="space-y-2">
                <h3 class="font-semibold text-gray-700 uppercase text-xs tracking-wider">Aktivni Trakeri</h3>
                <div id="tracker-list" class="space-y-2">
                    <p class="text-gray-400 text-xs italic">Nema aktivnih trakera...</p>
                </div>
            </div>

            <!-- Sekcija: Moja Lokacija -->
            <div class="space-y-2">
                <h3 class="font-semibold text-gray-700 uppercase text-xs tracking-wider">GPS Telefona</h3>
                <button onclick="togglePhoneLocation()" id="phone-loc-btn" class="w-full bg-emerald-600 text-white py-2 px-4 rounded-lg shadow font-medium hover:bg-emerald-700 transition">
                    Prikaži moju lokaciju
                </button>
            </div>

        </div>
    </div>

    <!-- Pozadina zatamnjenja kada je meni otvoren -->
    <div id="menu-backdrop" onclick="toggleMenu()" class="fixed inset-0 bg-black/50 z-[1500] hidden transition-opacity"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, currentLayerName = 'standard';
        let trackers = {}; // Čuva podatke za svaki traker
        let phoneMarker = null, phoneCircle = null, watchId = null;
        let bleCharacteristic = null;

        // Paleta boja za različite trakere
        const trackerColors = ['#e11d48', '#2563eb', '#16a34a', '#d97706', '#9333ea', '#0891b2'];

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([44.18, 20.95], 13);
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            setLayer('standard');
        }

        // Upravljanje slojevima mapa
        let activeTileLayer = null;
        function setLayer(name) {
            currentLayerName = name;
            if (activeTileLayer) map.removeLayer(activeTileLayer);

            // Resetuj stil dugmića u meniju
            ['standard', 'satellite', 'topo', 'dark'].forEach(l => {
                let btn = document.getElementById('btn-' + l);
                if(btn) btn.className = "p-2 border rounded-lg text-center hover:bg-gray-50 font-medium text-gray-700 bg-white";
            });
            let activeBtn = document.getElementById('btn-' + name);
            if(activeBtn) activeBtn.className = "p-2 border rounded-lg text-center font-medium text-white bg-blue-600";

            if (name === 'standard') {
                activeTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
            } else if (name === 'satellite') {
                activeTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
            } else if (name === 'topo') {
                activeTileLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17 }).addTo(map);
            } else if (name === 'dark') {
                activeTileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
            }
            toggleMenu(); // Zatvori meni nakon izbora
        }

        // Otvaranje/zatvaranje padajućeg menija
        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            const backdrop = document.getElementById('menu-backdrop');
            const isOpen = menu.classList.contains('translate-x-0');

            if (isOpen) {
                menu.classList.remove('translate-x-0');
                menu.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            } else {
                menu.classList.remove('-translate-x-full');
                menu.classList.add('translate-x-0');
                backdrop.classList.remove('hidden');
            }
        }

        // Ažuriranje pozicije trakera na mapi
        function updateTrackerData(id, lat, lng) {
            let colorIndex = Object.keys(trackers).length % trackerColors.length;
            let color = trackerColors[colorIndex];

            if (!trackers[id]) {
                // Kreiraj novi traker
                let marker = L.circleMarker([lat, lng], {
                    radius: 8,
                    fillColor: color,
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                }).addTo(map).bindPopup(`<b>Traker: ${id}</b>`);

                let polyline = L.polyline([], {color: color, weight: 4, opacity: 0.7}).addTo(map);

                trackers[id] = { marker, polyline, history: [], color };
            }

            let trk = trackers[id];
            trk.history.push([lat, lng]);
            trk.marker.setLatLng([lat, lng]);
            trk.polyline.setLatLngs(trk.history);
            
            // Centriraj mapu na poslednji primljeni podatak
            map.setView([lat, lng]);

            updateTrackerListUI();
        }

        // Ažuriranje liste trakera u meniju
        function updateTrackerListUI() {
            const listEl = document.getElementById('tracker-list');
            listEl.innerHTML = '';

            for (let id in trackers) {
                let trk = trackers[id];
                let lastPos = trk.history[trk.history.length - 1];
                let div = document.createElement('div');
                div.className = "flex items-center justify-between p-2 bg-gray-50 rounded-lg border border-gray-100";
                div.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full" style="background-color: ${trk.color}"></span>
                        <span class="font-bold text-gray-800">${id}</span>
                    </div>
                    <span class="text-xs text-gray-500">${lastPos[0].toFixed(4)}, ${lastPos[1].toFixed(4)}</span>
                `;
                listEl.appendChild(div);
            }
        }

        // Simulacija podataka za testiranje (bez hardvera)
        function simulateData() {
            let baseLat = 44.18 + (Math.random() - 0.5) * 0.05;
            let baseLng = 20.95 + (Math.random() - 0.5) * 0.05;

            updateTrackerData("TRK-01", baseLat, baseLng);
            updateTrackerData("TRK-02", baseLat + 0.01, baseLng + 0.01);

            document.getElementById('connection-status').innerHTML = "🟢 Povezano (Simulacija)";
        }

        // Praćenje lokacije samog telefona
        function togglePhoneLocation() {
            const btn = document.getElementById('phone-loc-btn');
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                if (phoneMarker) { map.removeLayer(phoneMarker); phoneMarker = null; }
                if (phoneCircle) { map.removeLayer(phoneCircle); phoneCircle = null; }
                btn.innerText = "Prikaži moju lokaciju";
                btn.className = "w-full bg-emerald-600 text-white py-2 px-4 rounded-lg shadow font-medium hover:bg-emerald-700 transition";
            } else {
                if (!navigator.geolocation) {
                    alert("Geolokacija nije podržana na vašem uređaju.");
                    return;
                }
                btn.innerText = "Sakrij moju lokaciju";
                btn.className = "w-full bg-red-600 text-white py-2 px-4 rounded-lg shadow font-medium hover:bg-red-700 transition";
                
                watchId = navigator.geolocation.watchPosition(pos => {
                    let lat = pos.coords.latitude;
                    let lng = pos.coords.longitude;
                    let acc = pos.coords.accuracy;

                    if (!phoneMarker) {
                        phoneMarker = L.marker([lat, lng]).addTo(map).bindPopup("<b>Vaša lokacija</b>");
                        phoneCircle = L.circle([lat, lng], { radius: acc }).addTo(map);
                    } else {
                        phoneMarker.setLatLng([lat, lng]);
                        phoneCircle.setLatLng([lat, lng]);
                        phoneCircle.setRadius(acc);
                    }
                }, err => {
                    alert("Greška GPS-a: " + err.message);
                }, { enableHighAccuracy: true });
            }
            toggleMenu();
        }

        // Web Bluetooth Konekcija sa ESP32 Prijemnikom
        async function connectBLE() {
            const PASSWORD = prompt("Unesite lozinku za povezivanje sa prijemnikom:", "MojaLozinka123");
            if (!PASSWORD) return;

            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['4fa1c001-0000-1000-8000-00805f9b34fb'] }]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('4fa1c001-0000-1000-8000-00805f9b34fb');
                const characteristic = await service.getCharacteristic('4fa1c002-0000-1000-8000-00805f9b34fb');

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    let decoder = new TextDecoder('utf-8');
                    let value = decoder.decode(event.target.value);
                    // Očekivani format sa ESP32: TRK-01|lat|lng
                    let parts = value.split('|');
                    if (parts.length >= 3) {
                        updateTrackerData(parts[0], parseFloat(parts[1]), parseFloat(parts[2]));
                    }
                });

                document.getElementById('connection-status').innerHTML = "🟢 Povezano sa ESP32";
                alert("Uspešno povezano sa Bluetooth prijemnikom!");
                toggleMenu();
            } catch (error) {
                console.error(error);
                alert("Greška pri Bluetooth povezivanju: " + error);
            }
        }

        window.onload = initMap;
    </script>
</body>
</html>
